<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مكتب الحسين</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#050505;color:#fff;text-align:center}
.wrap{max-width:900px;margin:auto;padding:22px}
.logo{width:min(360px,85vw);border-radius:50%;display:block;margin:10px auto 20px;box-shadow:0 0 30px #087cff}
h1{margin:8px 0;color:#ffd400;font-size:32px}
p{font-size:18px;color:#ddd}
.buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:28px}
a,button{display:block;padding:16px;border:2px solid #087cff;border-radius:14px;background:#111;color:#fff;text-decoration:none;font-size:18px;font-weight:bold;cursor:pointer}
a:hover,button:hover{background:#ffd400;color:#000;border-color:#ffd400}
.note{margin-top:28px;padding:15px;border-radius:14px;background:#111;border:1px solid #333;color:#bbb}
footer{margin-top:30px;color:#888;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.jpg" alt="شعار مكتب الحسين">
  <h1>مكتب الحسين</h1>
  <p>للموبايل والقرطاسية والألعاب</p>

  <div class="buttons">
    <a href="https://wa.me/9647810069115">واتساب</a>
    <a href="#">الألعاب</a>
    <a href="#">الخدمات</a>
    <a href="#">التواصل معنا</a>
  </div>

  <div class="note">
    هذه صفحة تعريفية للمحل. يمكن استبدال الأزرار أعلاه بروابط وملفات الويب التي تملك حق توزيعها.
  </div>

  <footer>وكيل نجوم الرابعة</footer>
</div>
</body>
</html>
